<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایش قند خون</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #1f0a2b 0%, #0e0514 50%, #040106 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', 'Tahoma', system-ui, sans-serif;
            padding: 2rem 1.5rem;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* هاله‌های نورانی پس‌زمینه */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: rgba(160, 70, 220, 0.22);
            top: -100px;
            right: -80px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(110, 40, 160, 0.18);
            bottom: -120px;
            left: -60px;
        }

        .platform {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            background: rgba(22, 10, 30, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            padding: 2.8rem 2.4rem 2.4rem 2.4rem;
            box-shadow:
                0 40px 80px -20px rgba(0, 0, 0, 0.95),
                inset 0 0 0 1px rgba(220, 160, 255, 0.1);
            border: 1px solid rgba(180, 110, 240, 0.18);
        }

        /* --- سربرگ --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            background: linear-gradient(135deg, #a94bff, #6f1fb0);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 22px -6px rgba(170, 80, 255, 0.65), inset 0 1px 0 rgba(255,255,255,0.25);
            font-size: 1.6rem;
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #f4e4ff;
            line-height: 1.2;
        }

        .brand-text p {
            font-size: 0.78rem;
            color: #a882c4;
            font-weight: 400;
            margin-top: 0.15rem;
            letter-spacing: 0.3px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(60, 30, 85, 0.6);
            border: 1px solid rgba(170, 100, 230, 0.3);
            border-radius: 100px;
            padding: 0.45rem 1rem;
            font-size: 0.72rem;
            color: #cba8e6;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #b15cff;
            box-shadow: 0 0 10px #b15cff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* --- بخش ورودی‌ها --- */
        .section-title {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #8f63b0;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-right: 0.3rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .input-card {
            background: rgba(14, 6, 20, 0.75);
            border-radius: 1.4rem;
            padding: 1.1rem 1.15rem 1.15rem 1.15rem;
            border: 1px solid rgba(120, 70, 160, 0.28);
            transition: all 0.2s ease;
        }

        .input-card:focus-within {
            border-color: #b15cff;
            background: rgba(24, 10, 34, 0.85);
            box-shadow: 0 0 0 3px rgba(177, 92, 255, 0.15);
        }

        .input-card label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #a882c4;
            margin-bottom: 0.55rem;
            letter-spacing: 0.2px;
        }

        .input-card input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid #3a1f4d;
            padding: 0.25rem 0 0.4rem 0;
            font-size: 1.35rem;
            font-weight: 600;
            color: #f4e4ff;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Vazirmatn', sans-serif;
            letter-spacing: 0.3px;
        }

        .input-card input:focus {
            border-bottom-color: #c86bff;
        }

        .input-card input::placeholder {
            color: #4d2f63;
            font-weight: 400;
            font-size: 1rem;
        }

        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* --- دکمه‌ها --- */
        .action-bar {
            display: flex;
            gap: 0.9rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 0.95rem 1.6rem;
            border-radius: 1.2rem;
            border: none;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 0.98rem;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9b3df0, #6f1fb0);
            color: #ffffff;
            box-shadow: 0 12px 24px -10px rgba(155, 61, 240, 0.8), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ab4fff, #7d2ac4);
            transform: translateY(-1px);
            box-shadow: 0 16px 30px -10px rgba(155, 61, 240, 0.9);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(40, 20, 55, 0.6);
            color: #cba8e6;
            border: 1px solid rgba(120, 70, 160, 0.35);
        }

        .btn-secondary:hover {
            background: rgba(55, 28, 75, 0.8);
            color: #f0d9ff;
            border-color: rgba(170, 100, 230, 0.5);
        }

        /* --- پنل نتیجه --- */
        .result-panel {
            background: rgba(10, 4, 15, 0.7);
            border-radius: 1.8rem;
            padding: 1.6rem 1.8rem;
            border: 1px solid rgba(160, 90, 220, 0.25);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .result-header span:first-child {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8f63b0;
            font-weight: 600;
        }

        .result-header .mode-tag {
            font-size: 0.68rem;
            color: #6a4a82;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-value {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .result-value .binary {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 2.6rem;
            font-weight: 800;
            padding: 0.05rem 1.4rem;
            border-radius: 1.2rem;
            background: #17091f;
            border: 1px solid #7a3ca3;
            color: #e6c9ff;
            min-width: 110px;
            text-align: center;
            letter-spacing: 1px;
            transition: all 0.25s ease;
        }

        .result-value .label-badge {
            font-size: 1.15rem;
            font-weight: 700;
            padding: 0.5rem 1.4rem;
            border-radius: 1.2rem;
            background: rgba(160, 70, 220, 0.16);
            border: 1px solid #b160f0;
            color: #e8d0ff;
            transition: all 0.25s ease;
        }

        .path-trace {
            margin-top: 1.1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(90, 50, 120, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem 0.55rem;
            line-height: 1.7;
        }

        .path-trace span {
            background: rgba(28, 13, 40, 0.9);
            padding: 0.22rem 0.85rem;
            border-radius: 100px;
            border: 1px solid rgba(90, 45, 125, 0.6);
            color: #c9a3e6;
            font-size: 0.72rem;
            font-weight: 400;
            white-space: nowrap;
        }

        .path-trace .placeholder {
            color: #6a4a82;
            border-style: dashed;
            background: transparent;
        }

        /* --- فوتر --- */
        .footer-note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(70, 40, 95, 0.35);
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .footer-note p {
            font-size: 0.7rem;
            color: #6a4a82;
            letter-spacing: 0.3px;
        }

        .footer-dots {
            display: flex;
            gap: 5px;
        }

        .footer-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3a1f4d;
        }

        .footer-dots span:first-child {
            background: #b15cff;
            box-shadow: 0 0 8px #b15cff;
        }

        /* --- ریسپانسیو --- */
        @media (max-width: 600px) {
            .platform {
                padding: 1.8rem 1.4rem;
                border-radius: 2rem;
            }
            .brand-icon {
                width: 44px;
                height: 44px;
                font-size: 1.35rem;
                border-radius: 14px;
            }
            .brand-text h1 {
                font-size: 1.2rem;
            }
            .result-value .binary {
                font-size: 2rem;
                min-width: 85px;
            }
            .result-value .label-badge {
                font-size: 0.98rem;
                padding: 0.4rem 1.1rem;
            }
            .header {
                margin-bottom: 1.6rem;
            }
            .status-pill {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="platform">

    <!-- سربرگ -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon">🩸</div>
            <div class="brand-text">
                <h1>پایش قند خون</h1>
                <p>سامانه هوشمند ارزیابی ریسک</p>
            </div>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            آماده به کار
        </div>
    </div>

    <!-- ورودی‌ها -->
    <div class="section-title">اطلاعات بیمار</div>
    <div class="grid-inputs">
        <div class="input-card">
            <label>گلوکز (mg/dL)</label>
            <input type="number" id="glucoseInput" placeholder="۱۴۸" step="any" value="140">
        </div>
        <div class="input-card">
            <label>سن (سال)</label>
            <input type="number" id="ageInput" placeholder="۳۳" step="any" value="35">
        </div>
        <div class="input-card">
            <label>شاخص توده بدنی</label>
            <input type="number" id="bmiInput" placeholder="۲۸.۵" step="any" value="29.0">
        </div>
        <div class="input-card">
            <label>شجره‌نامه دیابت</label>
            <input type="number" id="dpfInput" placeholder="۰.۶۲۷" step="any" value="0.50">
        </div>
    </div>

    <!-- دکمه‌ها -->
    <div class="action-bar">
        <button class="btn btn-primary" id="predictBtn">⚡ تحلیل و پیش‌بینی</button>
        <button class="btn btn-secondary" id="resetBtn">⟲ بازنشانی</button>
    </div>

    <!-- پنل نتیجه -->
    <div class="result-panel">
        <div class="result-header">
            <span>نتیجه ارزیابی</span>
            <span class="mode-tag">مدل تشخیصی · نسخه ۱.۰</span>
        </div>
        <div class="result-value">
            <span class="binary" id="binaryResult">—</span>
            <span class="label-badge" id="labelResult">در انتظار تحلیل</span>
        </div>
        <div class="path-trace" id="pathTrace">
            <span class="placeholder">مسیر تحلیل پس از اجرا نمایش داده می‌شود</span>
        </div>
    </div>

    <!-- فوتر -->
    <div class="footer-note">
        <p>© سامانه پایش قند خون · ابزار کمکی تصمیم‌گیری</p>
        <div class="footer-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

</div>

<script>
    (function() {
        const glucoseInput = document.getElementById('glucoseInput');
        const ageInput     = document.getElementById('ageInput');
        const bmiInput     = document.getElementById('bmiInput');
        const dpfInput     = document.getElementById('dpfInput');
        const predictBtn   = document.getElementById('predictBtn');
        const resetBtn     = document.getElementById('resetBtn');
        const binaryResult = document.getElementById('binaryResult');
        const labelResult  = document.getElementById('labelResult');
        const pathTrace    = document.getElementById('pathTrace');

        const DEFAULTS = {
            glucose: 140,
            age: 35,
            bmi: 29.0,
            dpf: 0.50
        };

        function setDefaults() {
            glucoseInput.value = DEFAULTS.glucose;
            ageInput.value = DEFAULTS.age;
            bmiInput.value = DEFAULTS.bmi;
            dpfInput.value = DEFAULTS.dpf;
            binaryResult.textContent = '—';
            labelResult.textContent = 'در انتظار تحلیل';
            labelResult.style.background = 'rgba(160, 70, 220, 0.16)';
            labelResult.style.borderColor = '#b160f0';
            labelResult.style.color = '#e8d0ff';
            binaryResult.style.borderColor = '#7a3ca3';
            binaryResult.style.color = '#e6c9ff';
            binaryResult.style.background = '#17091f';
            pathTrace.innerHTML = '<span class="placeholder">مسیر تحلیل پس از اجرا نمایش داده می‌شود</span>';
        }

        resetBtn.addEventListener('click', setDefaults);

        // درخت تصمیم دقیقاً مطابق قوانین
        function classify(glucose, age, bmi, dpf) {
            const path = [];

            if (glucose <= 154) {
                path.push('گلوکز ≤ ۱۵۴');

                if (age <= 29) {
                    path.push('سن ≤ ۲۹');
                    path.push('نتیجه: ۰');
                    return { prediction: 0, path };
                } else {
                    path.push('سن > ۲۹');

                    if (bmi <= 26.700) {
                        path.push('BMI ≤ ۲۶.۷');
                        path.push('نتیجه: ۰');
                        return { prediction: 0, path };
                    } else {
                        path.push('BMI > ۲۶.۷');

                        if (glucose <= 101) {
                            path.push('گلوکز ≤ ۱۰۱');

                            if (dpf <= 0.709) {
                                path.push('DPF ≤ ۰.۷۰۹');
                                path.push('نتیجه: ۰');
                                return { prediction: 0, path };
                            } else {
                                path.push('DPF > ۰.۷۰۹');
                                path.push('نتیجه: ۱');
                                return { prediction: 1, path };
                            }
                        } else {
                            path.push('گلوکز > ۱۰۱');

                            if (bmi <= 43.300) {
                                path.push('BMI ≤ ۴۳.۳');

                                if (dpf <= 0.464) {
                                    path.push('DPF ≤ ۰.۴۶۴');
                                    path.push('نتیجه: ۰');
                                    return { prediction: 0, path };
                                } else {
                                    path.push('DPF > ۰.۴۶۴');
                                    path.push('نتیجه: ۱');
                                    return { prediction: 1, path };
                                }
                            } else {
                                path.push('BMI > ۴۳.۳');
                                path.push('نتیجه: ۱');
                                return { prediction: 1, path };
                            }
                        }
                    }
                }
            } else {
                path.push('گلوکز > ۱۵۴');

                if (dpf <= 0.307) {
                    path.push('DPF ≤ ۰.۳۰۷');

                    if (dpf <= 0.287) {
                        path.push('DPF ≤ ۰.۲۸۷');
                        path.push('نتیجه: ۱');
                        return { prediction: 1, path };
                    } else {
                        path.push('DPF > ۰.۲۸۷');
                        path.push('نتیجه: ۰');
                        return { prediction: 0, path };
                    }
                } else {
                    path.push('DPF > ۰.۳۰۷');
                    path.push('نتیجه: ۱');
                    return { prediction: 1, path };
                }
            }
        }

        function renderResult(prediction, pathSteps) {
            const binaryDisplay = prediction === 1 ? '۱' : '۰';
            const labelDisplay = prediction === 1 ? 'ریسک بالا' : 'ریسک پایین';

            binaryResult.textContent = binaryDisplay;
            labelResult.textContent = labelDisplay;

            if (prediction === 1) {
                labelResult.style.background = 'rgba(255, 80, 140, 0.2)';
                labelResult.style.borderColor = '#ff5e9e';
                labelResult.style.color = '#ffc2dd';
                binaryResult.style.borderColor = '#ff70a8';
                binaryResult.style.color = '#ffd0e4';
                binaryResult.style.background = '#1f0813';
            } else {
                labelResult.style.background = 'rgba(120, 255, 200, 0.14)';
                labelResult.style.borderColor = '#3fe0aa';
                labelResult.style.color = '#b8ffe2';
                binaryResult.style.borderColor = '#3fc59a';
                binaryResult.style.color = '#d0ffec';
                binaryResult.style.background = '#061f18';
            }

            if (pathSteps.length === 0) {
                pathTrace.innerHTML = '<span class="placeholder">مسیری ثبت نشد</span>';
                return;
            }

            const chips = pathSteps.map(step => {
                if (step.includes('نتیجه')) {
                    return `<span style="background:rgba(40,15,58,0.95); border-color:#a35cd6; color:#f0d9ff; font-weight:600;">${step}</span>`;
                }
                return `<span>${step}</span>`;
            }).join('');

            pathTrace.innerHTML = chips;
        }

        function predict() {
            let glucose = parseFloat(glucoseInput.value);
            let age = parseFloat(ageInput.value);
            let bmi = parseFloat(bmiInput.value);
            let dpf = parseFloat(dpfInput.value);

            let usedFallback = false;
            if (isNaN(glucose)) { glucose = DEFAULTS.glucose; usedFallback = true; glucoseInput.value = DEFAULTS.glucose; }
            if (isNaN(age)) { age = DEFAULTS.age; usedFallback = true; ageInput.value = DEFAULTS.age; }
            if (isNaN(bmi)) { bmi = DEFAULTS.bmi; usedFallback = true; bmiInput.value = DEFAULTS.bmi; }
            if (isNaN(dpf)) { dpf = DEFAULTS.dpf; usedFallback = true; dpfInput.value = DEFAULTS.dpf; }

            const { prediction, path } = classify(glucose, age, bmi, dpf);
            renderResult(prediction, path);

            if (usedFallback) {
                const note = document.createElement('span');
                note.style.background = '#3a2410';
                note.style.borderColor = '#d98e4a';
                note.style.color = '#ffd9b0';
                note.textContent = '⚠️ ورودی نامعتبر';
                pathTrace.appendChild(note);
            }
        }

        predictBtn.addEventListener('click', predict);

        const inputs = [glucoseInput, ageInput, bmiInput, dpfInput];
        inputs.forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    predict();
                }
            });
        });

        setDefaults();

        window.addEventListener('load', () => {
            setTimeout(predict, 50);
        });
    })();
</script>
</body>
</html>
